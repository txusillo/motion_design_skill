      // ============ 17: IPC ============

      var s17 =
        '<g id="ef-s17">' +

            T(150, 385, "IPC · ABRIL 2026 · VARIACIÓN MENSUAL", { mono: true, s: 26, c: MUTED }) +
            T(150, 530, "+", { s: 110, w: 800, c: AMBER, extra: 'filter="url(#' + GLID + ')"' }) +
            '<g filter="url(#' + GLID + ')"><g id="ef-d0">' + seg7("0", DX0, DY, DW, DH, DT, AMBER) + '</g>' + seg7(",", 338.7, DY, DW, DH, DT, AMBER) + '<g id="ef-d1">' + seg7("0", DDX, DY, DW, DH, DT, AMBER) + '</g></g>' +
          '</g>' +
          '<g id="ef-pct">' + T(570, 530, "%", { s: 110, w: 800, c: AMBER }) + '</g>' +
          '<g id="ef-mar">' + T(150, 690, "MAR", { mono: true, s: 26, c: MUTED }) + '</g>' +
          '<rect id="ef-bmar" x="250" y="660" width="0" height="44" rx="6" fill="' + MUTED + '"/>' +

          '<g id="ef-abr">' + T(150, 780, "ABR", { mono: true, s: 26, c: AMBER }) + '</g>' +
          '<rect id="ef-babr" x="250" y="750" width="0" height="44" rx="6" fill="' + AMBER + '"/>' +
          '<g id="ef-tabr">' + T(920, 784, "1,3%", { s: 40, w: 800, c: AMBER }) + '</g>' +
          '<g id="ef-nota17">' + T(150, 880, "MAYOR ALZA MENSUAL DESDE JULIO 2022 · INE", { mono: true, s: 26, c: MUTED }) + '</g>' +
        '</g>';

      // ============ 18: velocimetro ============
      var GC = [540, 960], GR = 360, ga = function (x) { return Math.PI * (1 - x / 6); };
      var GP = function (x, r) { r = r || GR; return [GC[0] + r * Math.cos(ga(x)), GC[1] - r * Math.sin(ga(x))]; };
      var arc = function (id, x0, x1, col, w, extra) { var A = GP(x0), B = GP(x1); return '<path ' + (id ? 'id="' + id + '" ' : '') + 'd="M' + A[0] + ' ' + A[1] + ' A' + GR + ' ' + GR + ' 0 0 1 ' + B[0] + ' ' + B[1] + '" fill="none" stroke="' + col + '" stroke-width="' + w + '" ' + (extra || "") + '/>'; };

        '<g id="ef-s18">' +
          '<g id="ef-gauge">' + arc("", 0, 6, "#3d4248", 60) + ticks18 + '</g>' +

          '<g id="ef-meta">' + T(540, 470, "META BANCO CENTRAL: 3% ± 1", { a: "middle", mono: true, s: 26, c: TEAL }) + '</g>' +
          '<g id="ef-mark"><line x1="' + GC[0] + '" y1="' + GC[1] + '" x2="' + M0[0] + '" y2="' + M0[1] + '" stroke="' + MUTED + '" stroke-width="8" stroke-dasharray="10 10"/></g>' +

          '<g id="ef-v40">' + T(540, 1048, "→", { a: "middle", s: 84, w: 800, c: INK }) + T(598, 1050, "4,0%", { s: 84, w: 800, c: INK }) + '</g>' +
          '<g id="ef-n18">' + T(540, 1104, "INFLACIÓN EN 12 MESES · MARZO → ABRIL 2026 · INE", { a: "middle", mono: true, s: 26, c: MUTED }) + '</g>' +
        '</g>';

      // ============ 19: zoom al pie del muro ============
      var s19 =
        '<g id="ef-s19">' +
          '<defs><clipPath id="ef-cp19"><rect x="0" y="300" width="1080" height="880"/></clipPath></defs>' +
          '<g clip-path="url(#ef-cp19)"><g id="ef-st2in"><g id="ef-st2z">' +
            stairs({ id: "ef-t" }) + T(140, 400, "PARA SUBIR $372", { mono: true, s: 26, c: MUTED }) + T(140, 1106, "~$26 CADA 3 SEMANAS · CÁLCULO PROPIO", { mono: true, s: 26, c: MUTED }) +
          '</g></g></g>' +
          '<g id="ef-g1">' + person(270, 1010, 1.15, "#4b6b8a", "#c8936a", "#2a201a") + person(385, 1021.5, 1.0925, ORANGE, "#eac6a2", "#5b3b24", { long: true }) + person(482.75, 1056, 0.713, AMBER, "#946043", "#1a1a1a") + '</g>' +
          '<g id="ef-g2">' + truck(520, 940, 0.42) + '</g>' +
          '<g id="ef-g3"><g transform="translate(820 930)"><rect width="170" height="130" fill="#454a52" stroke="' + INK + '" stroke-width="5"/><path d="M-14 0 L85 -60 L184 0 Z" fill="' + ORANGE + '"/>' + T(85, 80, "TIENDA", { a: "middle", mono: true, s: 26, c: INK }) + '</g></g>' +

      var svg = document.getElementById("ef-svg");
      svg.innerHTML = glowDefs() + s13 + s14 + s15 + s16 + s17 + s18 + s19;

      // ============================================ linea de tiempo ============================================
      var tl = gsap.timeline({ paused: true });
      function at(sel, ox, oy) { gsap.set(sel, { svgOrigin: ox + " " + oy }); }
      function pop(sel, t, ox, oy) {
        at(sel, ox, oy);
        tl.fromTo(sel, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.4)" }, L(t));
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, L(t));
      }
      function out(sel, t, ox, oy, d, ez) {
        at(sel, ox, oy);
        tl.to(sel, { scale: 0, duration: d || 0.18, ease: ez || "power2.in" }, L(t));
        tl.to(sel, { opacity: 0, duration: 0.05, ease: "none" }, L(t) + (d || 0.18) - 0.05);
      }
      function leave(sel, t, d) {
        d = d || 0.18; at(sel, 540, 700);
        tl.to(sel, { scale: 0.9, opacity: 0, duration: d, ease: "power3.in" }, L(t));
      }
      function shake(sel, t, amp, dur, tag) {
        var o = { k: 0 };
        var f = function (k) { var tau = k * dur, a = amp * Math.exp(-14 * tau) * Math.sin(2 * Math.PI * 16 * tau); gsap.set(sel, { x: a, y: a * 0.6 }); };
        tl.fromTo(o, { k: 0 }, { k: 1, duration: dur, ease: "none", onUpdate: function () { f(o.k); }, onReverseComplete: function () { f(0); } }, L(t));
        tl.set(sel, { x: 0, y: 0 }, L(t) + dur + 0.01);
      }
      gsap.set(["#ef-s14", "#ef-s15", "#ef-s16", "#ef-s17", "#ef-s18", "#ef-s19"], { opacity: 1 });

      // ---- 52,25 salida de la escena 13 y entrada de la 14
      leave("#ef-s13", 52.25, 0.15);
      at("#ef-s-axis", 540, 1000);
      tl.fromTo("#ef-s-axis", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, L(52.39));
      pop("#ef-sub", 52.39, 270, 392);
      gsap.set(["#ef-s-regla", "#ef-s-marz", "#ef-s-plus", "#ef-nota14"], { opacity: 0 });
      tl.set("#ef-cprS", { attr: { width: 109 } }, L(52.39));
      tl.to("#ef-cprS", { attr: { width: 878 }, duration: 2.56, ease: "steps(13)" }, L(52.74));
      pop("#ef-s-regla", 55.3, 726, 440);
      pop("#ef-nota14", 55.5, 490, 1096);
      // 56,16 el muro sube de golpe
      gsap.set("#ef-s-wall", { opacity: 0 });
      at("#ef-s-wall", 140, 1000);
      tl.fromTo("#ef-s-wall", { scaleY: 0 }, { scaleY: 1, duration: 0.15, ease: "power3.out" }, L(56.16));
      tl.fromTo("#ef-s-wall", { opacity: 0 }, { opacity: 1, duration: 0.03, ease: "none" }, L(56.16));
      shake("#ef-s14", 56.31, 4, 0.2);
      pop("#ef-s-marz", 56.25, 330, 510);
      pop("#ef-s-plus", 56.25, 900, 410);

      pop("#ef-pan15", 56.6, 770, 630);
      pop("#ef-cero", 57.4, 770, 560);

      // ---- 58,90 escena 16
      leave("#ef-s15", 58.55);
      gsap.set("#ef-s16", { opacity: 0 });
      tl.set("#ef-s16", { opacity: 1 }, L(58.74));
      tl.fromTo("#ef-truck", { x: -800 }, { x: 0, duration: 0.7, ease: "power3.out" }, L(58.74));
      pop("#ef-tg0", 60.84, 300, 460); pop("#ef-tg1", 61.16, 490, 460); pop("#ef-tg2", 61.8, 680, 460);

      pop("#ef-ipc", 62.43, 540, 455);
