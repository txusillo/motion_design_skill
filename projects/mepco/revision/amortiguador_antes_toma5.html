      tl.set("#am-lA", { opacity: 1 }, L(15.6));
      tl.fromTo("#am-lA", { x: ZX - 275, y: ZY - 677, scale: 18 }, { x: 0, y: 0, scale: 1, duration: 0.4, ease: "power3.out" }, L(15.6));

      pop("#am-arr", ST, 535, 700);
      pop("#am-lB", ST + 0.04, 805, 700);
      var imp0 = 450 * KL, par0 = 700 * KL, imp1 = 270 * KL, par1 = 930 * KL;
