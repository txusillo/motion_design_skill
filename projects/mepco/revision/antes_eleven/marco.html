<template>
  <style>
    @font-face { font-family: "Barlow Condensed"; font-weight: 700; src: url("assets/fonts/BarlowCondensed-Bold.ttf"); }
    #root { position: absolute; inset: 0; color: #8b8d91; font-family: "JetBrains Mono", monospace; }
    #mc-safe { position: absolute; inset: 0; transform: translateY(77px) scale(0.88); transform-origin: 540px 883px; }
    .mc-mono { letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
    #mc-hud, #mc-foot-row { position: absolute; left: 70px; right: 130px; height: 40px; }
    #mc-hud { top: 236px; font-size: 28px; line-height: 40px; }
    #mc-foot-row { top: 1500px; font-size: 26px; line-height: 36px; }
    #mc-hud-l, #mc-sec-stack { position: absolute; left: 0; top: 0; }
    #mc-hud-r, #mc-time-stack { position: absolute; right: 0; top: 0; text-align: right; }
    .mc-lab { position: absolute; top: 0; white-space: nowrap; }
    #mc-hud-r .mc-lab, #mc-time-stack .mc-lab { right: 0; }
    #mc-sec-stack .mc-lab { left: 0; }
    #mc-time-stack .mc-lab { color: #ffb000; }
    #mc-bar { position: absolute; left: 70px; right: 130px; top: 1552px; height: 8px; background: #3d4248; border-radius: 4px; }
    #mc-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #ff6a13; border-radius: 4px; }
  </style>
  <div id="root" data-composition-id="marco" data-width="1080" data-height="1920">
    <div id="mc-safe">
      <div id="mc-hud" class="mc-mono">
        <div id="mc-hud-l">MEPCO · 2014–2026</div>
        <div id="mc-hud-r"></div>
      </div>
      <div id="mc-foot-row" class="mc-mono">
        <div id="mc-sec-stack"></div>
        <div id="mc-time-stack"></div>
      </div>
      <div id="mc-bar"><div id="mc-fill"></div></div>
    </div>
  </div>
  <script>
    (function () {
      var DUR = 95.572;        // fin del tramo implementado; subirlo en cada tramo
      var TOTAL = 95.572;     // duracion del video completo
      // [segundo, rotulo]
      var HUD = [[0,"JUE 26·03·2026"],[4.0,"MIÉ → JUE"],[5.59,"LEY 20.765"],[13.4,"EL BACHE"],[15.4,"UN LITRO"],[18.1,"DE A POCO"],[22.3,"DE VUELTA"],[26.5,"EL TRATO"],
        [29.75,"MARZO 2026"],[40.7,"23·03·2026"],[43.1,"VÍA DECRETO"],[44.95,"SIN AMORTIGUADOR"],[48.45,"26·03·2026"],
        [52.25,"ANTES VS. AHORA"],[56.47,"1 NOCHE"],[58.9,"CADENA"],[62.6,"IPC"],[69.2,"INFLACIÓN"],[73.6,"DE GOLPE"],
        [78.15,"NOV 2026"],[89.15,"¿Y TÚ?"],[93.2,"COMENTA"]];
      var SEC = [[0,"01/05 EL GOLPE"],[5.59,"02/05 EL AMORTIGUADOR"],[29.85,"03/05 LA DECISIÓN"],[52.34,"04/05 EL EFECTO"],[78.23,"05/05 HOY"]];
      var WA = [[0,0],[13.434,13.434],[13.98,13.96],[14.04,14.33],[14.471,15.903],[16.108,17.217],[17.199,18.267],[18.093,19.138]];
      // toma 5: la linea 5 es mas larga; W lleva tiempos de la toma 4 (sin gancho) a la toma 5
      function W(t) { for (var i = 1; i < WA.length; i++) if (t <= WA[i][0]) { var a = WA[i - 1], b = WA[i]; return a[1] + (t - a[0]) * (b[1] - a[1]) / (b[0] - a[0]); } return t >= 88.9 ? t + 1.045 - 1.703 : t + 1.045; }
      HUD.forEach(function (it) { it[0] = +W(it[0]).toFixed(3); });
      SEC.forEach(function (it) { it[0] = +W(it[0]).toFixed(3); });
      var tl = gsap.timeline({ paused: true });
      var OUT = { opacity: 0, filter: "blur(6px)", duration: 0.13, ease: "none" };
      function stack(host, prefix, items) {
        var list = items.filter(function (it) { return it[0] < DUR; });
        list.forEach(function (it, i) {
          var el = document.createElement("div");
          el.id = prefix + i; el.className = "mc-lab"; el.setAttribute("data-layout-allow-overlap", ""); el.textContent = it[1];
          document.getElementById(host).appendChild(el);
        });
        list.forEach(function (it, i) {
          var id = "#" + prefix + i;
          gsap.set(id, i === 0 ? { opacity: 1, filter: "blur(0px)" } : { opacity: 0, filter: "blur(6px)" });
          if (i > 0) tl.fromTo(id, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "none", immediateRender: false }, it[0]);
          var next = list[i + 1];
          if (next) tl.fromTo(id, { opacity: 1, filter: "blur(0px)" }, Object.assign({ immediateRender: false }, OUT), next[0] - 0.13);
        });
      }
      stack("mc-hud-r", "mc-h", HUD);
      stack("mc-sec-stack", "mc-s", SEC);
      // tiempo real mm:ss, un rotulo por segundo, sin parpadeos
      var nsec = Math.ceil(DUR);
      for (var s = 0; s < nsec; s++) {
        var el = document.createElement("div");
        el.id = "mc-t" + s; el.className = "mc-lab"; el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-ignore", "");
        el.textContent = "● " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
        document.getElementById("mc-time-stack").appendChild(el);
        tl.set("#mc-t" + s, { opacity: s === 0 ? 1 : 0 }, 0);
        if (s > 0) tl.set("#mc-t" + s, { opacity: 1 }, s);
        if (s < nsec - 1) tl.set("#mc-t" + s, { opacity: 0 }, s + 1);
      }
      gsap.set("#mc-fill", { width: "0%" });
      tl.fromTo("#mc-fill", { width: "0%" }, { width: (DUR / TOTAL * 100) + "%", duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["marco"] = tl;
    })();
  </script>
</template>
