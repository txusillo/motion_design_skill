<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Press Start 2P"; src: url("assets/fonts/PressStart2P-Regular.ttf"); }
      @font-face { font-family: "VT323"; src: url("assets/fonts/VT323-Regular.ttf"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #101c33; }
      #root { position: absolute; inset: 0; font-family: "Press Start 2P", monospace; color: #e6e4cf; -webkit-font-smoothing: none; }
      .abs { position: absolute; }
      canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; image-rendering: pixelated; }
      .esc { position: absolute; inset: 0; }
      .panel { left: 130px; top: 176px; width: 820px; height: 254px; background: #0d1524; border: 4px solid #e6e4cf; box-shadow: 12px 12px 0 #060a13; }
      .bar { position: absolute; left: 0; top: 0; right: 0; height: 60px; border-bottom: 4px solid #e6e4cf; display: flex; align-items: center; gap: 16px; padding: 0 12px; font-size: 28px; white-space: nowrap; }
      .stripes { height: 40px; flex: 1; background: repeating-linear-gradient(0deg, #e6e4cf 0 4px, transparent 4px 10px); }
      .num { position: absolute; left: 0; right: 0; top: 84px; text-align: center; font-size: 72px; line-height: 1; white-space: nowrap; }
      .sub { position: absolute; left: 0; right: 0; top: 178px; text-align: center; font-family: "VT323", monospace; font-size: 52px; line-height: 1; letter-spacing: 0.08em; white-space: nowrap; }
      .cap { left: 110px; top: 1400px; width: 860px; height: 190px; background: #070c18; border: 4px solid #e6e4cf; border-radius: 8px; padding: 0 32px; display: flex; align-items: center; font-family: "VT323", monospace; font-size: 64px; line-height: 76px; }
      .cap div { width: 100%; text-wrap: balance; }
      .cap b { font-weight: 400; background: #e6e4cf; color: #070c18; box-shadow: 6px 0 0 #e6e4cf, -6px 0 0 #e6e4cf; }
      .tag { font-size: 28px; line-height: 36px; white-space: nowrap; }
      .vt { font-family: "VT323", monospace; font-size: 40px; line-height: 44px; letter-spacing: 0.04em; }
      .line { position: absolute; }
      .big { position: relative; display: inline-block; }
      .big::after { content: ""; position: absolute; left: 34%; top: -2px; width: 18%; height: 8px; background: currentColor; transform: skewX(-30deg); }
      .num40 { font-size: 40px !important; top: 100px !important; }
      #fx { position: absolute; inset: 0; z-index: 9; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 4px), repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 1px, transparent 1px 4px); box-shadow: inset 0 0 220px rgba(0,0,0,.55); }
      #w { left: 90px; top: 200px; width: 900px; height: 1132px; background: #0d1524; border: 4px solid #e6e4cf; box-shadow: 12px 12px 0 #060a13; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="33" data-width="1080" data-height="1920">
      <div id="e1" class="esc clip" data-start="0" data-duration="1"></div>
      <div id="e2" class="esc clip" data-start="1" data-duration="1"></div>
      <div id="e3a" class="esc clip" data-start="2" data-duration="1"></div>
      <div id="e3b" class="esc clip" data-start="3" data-duration="1"></div>
      <div id="e3" class="esc clip" data-start="4" data-duration="1"></div>
      <div id="e4" class="esc clip" data-start="5" data-duration="1"></div>
      <div id="e5a" class="esc clip" data-start="6" data-duration="1"></div>
      <div id="e5" class="esc clip" data-start="7" data-duration="1"></div>
      <div id="e6a" class="esc clip" data-start="8" data-duration="1"></div>
      <div id="e6" class="esc clip" data-start="9" data-duration="1"></div>
      <div id="e7a" class="esc clip" data-start="10" data-duration="1"></div>
      <div id="e7" class="esc clip" data-start="11" data-duration="1"></div>
      <div id="e8" class="esc clip" data-start="12" data-duration="1"></div>
      <div id="e9a" class="esc clip" data-start="13" data-duration="1"></div>
      <div id="e9" class="esc clip" data-start="14" data-duration="1"></div>
      <div id="e10" class="esc clip" data-start="15" data-duration="1"></div>
      <div id="e10a" class="esc clip" data-start="16" data-duration="1"></div>
      <div id="e2a" class="esc clip" data-start="17" data-duration="1"></div>
      <div id="e2b" class="esc clip" data-start="18" data-duration="1"></div>
      <div id="e2c" class="esc clip" data-start="19" data-duration="1"></div>
      <div id="e11a" class="esc clip" data-start="20" data-duration="1"></div>
      <div id="e11b" class="esc clip" data-start="21" data-duration="1"></div>
      <div id="e12a" class="esc clip" data-start="22" data-duration="1"></div>
      <div id="e12b" class="esc clip" data-start="23" data-duration="1"></div>
      <div id="e13a" class="esc clip" data-start="24" data-duration="1"></div>
      <div id="e13b" class="esc clip" data-start="25" data-duration="1"></div>
      <div id="e14a" class="esc clip" data-start="26" data-duration="1"></div>
      <div id="e14b" class="esc clip" data-start="27" data-duration="1"></div>
      <div id="e15" class="esc clip" data-start="28" data-duration="1"></div>
      <div id="e16a" class="esc clip" data-start="29" data-duration="1"></div>
      <div id="e16b" class="esc clip" data-start="30" data-duration="1"></div>
      <div id="e17a" class="esc clip" data-start="31" data-duration="1"></div>
      <div id="e17b" class="esc clip" data-start="32" data-duration="1"></div>
      <div id="fx"></div>
    </div>
    <script>
      var seed = 2026;
      function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
      var INK = [214, 214, 196], ALERT = [232, 82, 127], GOLD = [220, 194, 102], BILL = [214, 136, 74];
      var STEEL = [[44, 63, 92], [70, 96, 138]], DIM = [[32, 45, 68], [40, 56, 84]];
      var INK2 = [170, 174, 160], INK3 = [128, 136, 130];

      // Cifras del guion, de la base a la cima; cada cubo son 20.000 personas
      var STRATA = [20000, 62000, 4425000, 4120000, 1491000, 989000, 4591667, 3105000, 1004000, 470380];
      var acc = 0;
      var CUM = STRATA.map(function (n) { acc += n; return Math.round(acc / 20000); });
      var CUBES = CUM[CUM.length - 1];
      var N = 6, A = 12, B = 6, C = 13, OX = 270, OY = 684;
      var cells = [];
      for (var gx = 0; gx < N; gx++) for (var gy = 0; gy < N; gy++) cells.push({ gx: gx, gy: gy });
      cells.sort(function (p, q) { return p.gx + p.gy - (q.gx + q.gy) || q.gx - p.gx; });
      var cubes = [];
      for (var layer = 0; cubes.length < CUBES; layer++) {
        var left = CUBES - cubes.length;
        (left < cells.length ? cells.slice(cells.length - left) : cells).forEach(function (cell) {
          cubes.push({ gx: cell.gx, gy: cell.gy, layer: layer, idx: cubes.length });
        });
      }
      cubes.forEach(function (c) { var s = 0; while (c.idx >= CUM[s]) s++; c.s = s; });
      var order = cubes.slice().sort(function (p, q) { return p.layer - q.layer || q.gx + q.gy - (p.gx + p.gy); });

      function css(c, k) { return "rgb(" + Math.round(c[0] * k) + "," + Math.round(c[1] * k) + "," + Math.round(c[2] * k) + ")"; }
      function poly(x, pts, fill) {
        x.beginPath(); x.moveTo(pts[0], pts[1]);
        for (var i = 2; i < pts.length; i += 2) x.lineTo(pts[i], pts[i + 1]);
        x.closePath(); x.fillStyle = fill; x.fill();
        x.strokeStyle = "#0a1120"; x.lineWidth = 0.5; x.stroke();
      }
      // Caja isometrica: (px, py) es la esquina frontal inferior
      function box(x, px, py, ar, al, h, c) {
        var br = ar / 2, bl = al / 2;
        poly(x, [px - al, py - bl - h, px, py - h, px, py, px - al, py - bl], css(c, 0.8));
        poly(x, [px, py - h, px + ar, py - br - h, px + ar, py - br, px, py], css(c, 0.56));
        poly(x, [px, py - h, px + ar, py - br - h, px + ar - al, py - br - bl - h, px - al, py - bl - h], css(c, 1));
      }
      function tower(x, color) {
        order.forEach(function (cube) {
          var c = color(cube);
          box(x, OX + (cube.gx - cube.gy) * A, OY - (cube.gx + cube.gy) * B - cube.layer * C, A, A, C, c);
        });
      }
      function dots(x) {
        for (var gy2 = -13; gy2 <= 13; gy2++) for (var gx2 = -7; gx2 <= 7; gx2++) {
          var dx = gx2 * 40, dy = gy2 * 40, r = Math.sqrt(dx * dx + dy * dy);
          var w = Math.sin((r / 280 - 0.4) * Math.PI * 2);
          x.fillStyle = "rgba(128,170,230," + (0.36 + 0.16 * w) + ")";
          x.fillRect(Math.round(270 + dx), Math.round(480 + dy), 2, 2);
        }
      }
      function person(x, px, py, shirt, hair, noFolder) {
        var a = 9, h = 11;
        box(x, px, py, a, a, h, [40, 48, 70]);
        box(x, px, py - h, a, a, h, [40, 48, 70]);
        box(x, px, py - 2 * h, a, a, h, shirt);
        box(x, px, py - 3 * h, a, a, h, shirt);
        box(x, px, py - 4 * h, a, a, h, [224, 186, 150]);
        box(x, px, py - 5 * h, a, a, 3, hair);
        // Ojos mirando al frente, carpeta en la mano
        x.fillStyle = "#1a1c2c";
        x.fillRect(px - 7, py - 4 * h - 7, 2, 2);
        x.fillRect(px - 3, py - 4 * h - 5, 2, 2);
        if (!noFolder) box(x, px - 4, py - 2 * h + 2, 7, 2, 9, [230, 228, 207]);
      }
      // Nino: mas bajo, con mochila
      function kid(x, px, py, shirt, hair) {
        var a = 7, h = 8;
        box(x, px + 6, py - 16, 3, 5, 12, [190, 90, 90]);
        box(x, px, py, a, a, h, [40, 48, 70]);
        box(x, px, py - h, a, a, h, shirt);
        box(x, px, py - 2 * h, a, a, h, shirt);
        box(x, px, py - 3 * h, a, a, h, [224, 186, 150]);
        box(x, px, py - 4 * h, a, a, 3, hair);
        x.fillStyle = "#1a1c2c";
        x.fillRect(px - 5, py - 3 * h - 5, 2, 2);
        x.fillRect(px - 2, py - 3 * h - 4, 2, 2);
      }
      // Persona mayor: pelo blanco y baston
      function elder(x, px, py, shirt) {
        var a = 9, h = 10;
        box(x, px - 10, py + 4, 1.5, 1.5, 34, [120, 84, 54]);
        box(x, px, py, a, a, h, [52, 56, 74]);
        box(x, px, py - h, a, a, h, [52, 56, 74]);
        box(x, px, py - 2 * h, a, a, h, shirt);
        box(x, px, py - 3 * h, a, a, h, shirt);
        box(x, px, py - 4 * h, a, a, h, [224, 186, 150]);
        box(x, px, py - 5 * h, a, a, 3, [226, 226, 222]);
        x.fillStyle = "#1a1c2c";
        x.fillRect(px - 7, py - 4 * h - 6, 2, 2);
        x.fillRect(px - 3, py - 4 * h - 4, 2, 2);
      }
      // Cuidadora empujando una silla de ruedas
      function caregiver(x, px, py) {
        person(x, px + 22, py - 11, [120, 170, 170], [58, 38, 30], true);
        box(x, px, py, 11, 11, 4, [30, 34, 48]);
        box(x, px + 6, py - 4, 3, 11, 13, [70, 78, 100]);
        box(x, px, py - 4, 11, 11, 3, [70, 78, 100]);
        box(x, px, py - 7, 9, 9, 10, [170, 150, 170]);
        box(x, px, py - 17, 9, 9, 9, [224, 186, 150]);
        box(x, px, py - 26, 9, 9, 3, [226, 226, 222]);
        // Ruedas de la silla
        x.fillStyle = "#10141f";
        x.beginPath(); x.arc(px - 5, py - 3, 6, 0, Math.PI * 2); x.fill();
        x.fillStyle = "#8a93a8";
        x.fillRect(px - 6, py - 4, 2, 2);
        x.fillStyle = "#10141f";
        x.beginPath(); x.arc(px + 6, py - 2, 4, 0, Math.PI * 2); x.fill();
      }
      // De cada 100: una multitud de 10 x 10; se encienden desde el frente
      function crowd(x, ox, oy, lit, color) {
        var list = [];
        for (var i = 0; i < 10; i++) for (var j = 0; j < 10; j++) list.push({ i: i, j: j });
        list.sort(function (p, q) { return p.i + p.j - (q.i + q.j) || q.i - p.i; });
        list.forEach(function (c, n) { c.on = n < lit; });
        list.slice().reverse().forEach(function (c) {
          var px = ox + (c.i - c.j) * 8, py = oy - (c.i + c.j) * 4;
          box(x, px, py, 4, 4, 5, c.on ? [52, 58, 78] : [30, 38, 56]);
          box(x, px, py - 5, 4, 4, 6, c.on ? color : [44, 56, 80]);
          box(x, px, py - 11, 4, 4, 4, c.on ? [224, 186, 150] : [58, 68, 92]);
        });
      }
      function exec(x, px, py) {
        person(x, px, py, [46, 54, 84], [24, 24, 30], true);
        x.fillStyle = "#e8527f";
        x.fillRect(px - 3, py - 34, 3, 12);
        box(x, px + 12, py - 2, 8, 3, 9, [120, 84, 54]);
      }
      function professional(x, px, py) {
        person(x, px, py, [190, 196, 190], [58, 38, 30], true);
        box(x, px + 12, py - 2, 8, 3, 9, [120, 84, 54]);
      }
      function tent(x, px, py) {
        box(x, px - 28, py + 12, 58, 34, 2, [150, 120, 86]);
        var c = [76, 104, 150];
        poly(x, [px - 30, py - 6, px - 2, py + 8, px + 8, py - 30, px - 18, py - 42], css(c, 0.8));
        poly(x, [px - 2, py + 8, px + 30, py - 8, px + 36, py - 44, px + 8, py - 30], css(c, 0.56));
        poly(x, [px - 18, py - 42, px + 8, py - 30, px + 36, py - 44, px + 10, py - 56], css(c, 1));
        poly(x, [px - 12, py + 3 - 4, px - 2, py + 8, px + 2, py - 12, px - 8, py - 18], "#10141f");
        person(x, px - 40, py + 2, [150, 92, 96], [58, 38, 30], true);
      }
      // Zoom sobre la torre: acerca la altura cy al centro del encuadre
      function zoomed(id, color, scale, cy, target, after) {
        var bg = document.createElement("canvas"); bg.width = 540; bg.height = 960;
        document.getElementById(id).appendChild(bg);
        dots(bg.getContext("2d"));
        var c = document.createElement("canvas"); c.width = 540; c.height = 960;
        c.style.transformOrigin = "540px " + cy + "px";
        c.style.transform = "translateY(" + (target - cy) + "px) scale(" + scale + ")";
        document.getElementById(id).appendChild(c);
        tower(c.getContext("2d"), color);
        if (after) after(c.getContext("2d"));
      }
      function vtLabel(id, l, t, w, txt, col) {
        html(id, '<div class="abs vt" style="left:' + l + "px;top:" + t + "px;width:" + w + "px;text-align:center;font-size:44px;line-height:48px;color:" + col + '">' + txt + "</div>");
      }
      function pile(x, cx, base, count) {
        for (var i = 0; i < count; i++) {
          var jx = Math.round((rand() - 0.5) * 3);
          box(x, cx + jx, base - i * 3, 44, 22, 3, i % 2 ? BILL : [190, 116, 62]);
        }
        // Marca de valor sobre el billete de arriba
        var topY = base - count * 3;
        x.fillStyle = "#f4dcae";
        x.fillRect(cx + 7, topY - 17, 8, 4);
        x.fillRect(cx - 5, topY - 11, 8, 4);
      }
      function layerY(l) { return 1296 - l * 26; }
      function layerOf(idx) { return idx / 36; }
      function html(id, s) { document.getElementById(id).insertAdjacentHTML("beforeend", s); }
      function canvasFor(id) {
        var c = document.createElement("canvas"); c.width = 540; c.height = 960;
        document.getElementById(id).appendChild(c);
        var x = c.getContext("2d"); dots(x); return x;
      }
      function panel(id, title, num, sub, col) {
        html(id, '<div class="abs panel"><div class="bar"><div class="stripes" style="flex:none;width:20px"></div>' + title + '<div class="stripes"></div></div><div class="num" style="color:' + col + '">' + num + '</div><div class="sub">' + sub + "</div></div>");
      }
      function cap(id, before, word, after) {
        html(id, '<div class="abs cap"><div>' + (before ? before + " " : "") + "<b>" + word + "</b>" + (after ? " " + after : "") + "</div></div>");
      }
      function apex(id) {
        html(id, '<div class="abs" style="left:534px;top:476px;width:12px;height:12px;background:#e8527f"></div>' +
          '<div class="abs tag" style="left:610px;top:452px;color:#dcc266">CLASE<br>ALTA?</div>');
      }
      function rect(id, l, t, w, h, c) { html(id, '<div class="line" style="left:' + l + "px;top:" + t + "px;width:" + w + "px;height:" + h + "px;background:" + c + '"></div>'); }
      // Llave a la derecha de la torre, de la capa a a la b, con linea hasta el panel
      function brace(id, a, b, c) {
        var y1 = layerY(b), y2 = layerY(a), mid = Math.round((y1 + y2) / 2);
        rect(id, 700, y1, 22, 4, c); rect(id, 700, y2, 22, 4, c); rect(id, 722, y1, 4, y2 - y1 + 4, c);
        rect(id, 726, mid, 68, 4, c); rect(id, 790, 430, 4, mid - 426, c);
      }
      function base(s) { return STEEL[s % 2]; }
      function dim(s) { return DIM[s % 2]; }

      // 1. Ventana
      (function () {
        var x = canvasFor("e1");
        html("e1", '<div id="w" class="abs"><div class="bar" style="height:72px"><div class="stripes" style="flex:none;width:20px"></div>CHILE.SYS &mdash; 2026<div class="stripes"></div></div>' +
          '<svg class="abs" style="left:32px;top:112px;width:96px;height:88px" viewBox="0 0 24 22" shape-rendering="crispEdges"><path d="M12 1 L23 21 H1 Z" fill="none" stroke="#e8527f" stroke-width="2"/><rect x="11" y="8" width="2" height="7" fill="#e8527f"/><rect x="11" y="16" width="2" height="2" fill="#e8527f"/></svg>' +
          '<div class="abs" style="left:152px;top:104px;font-size:64px;line-height:1">CLASE ALTA</div>' +
          '<div class="abs vt" style="left:154px;top:172px;color:#a3a795;letter-spacing:.14em">POBLACI&Oacute;N DE CHILE</div>' +
          '<div class="abs" style="left:32px;top:248px;font-size:40px;line-height:1;color:#dcc266">PERSONAS: ???</div>' +
          '<div class="abs vt" style="left:32px;right:32px;top:316px;height:64px;background:#2c3f5c;border:4px solid #e6e4cf;display:flex;align-items:center;justify-content:space-between;padding:0 18px"><span>BUSCANDO</span><span>43%</span></div>' +
          '<canvas id="sea" width="69" height="57" style="left:32px;top:408px;width:828px;height:684px"></canvas>' +
          '<div class="abs" style="left:620px;top:690px;width:84px;height:84px;background:#0d1524"></div><div class="abs" style="left:656px;top:726px;width:12px;height:12px;background:#e8527f"></div></div>');
        var s = document.getElementById("sea").getContext("2d");
        var sh = [[27,42,66],[34,51,79],[44,63,92],[54,76,110],[70,96,138]];
        for (var yy = 0; yy < 57; yy++) for (var xx = 0; xx < 69; xx++) { s.fillStyle = css(sh[Math.floor(rand() * rand() * 5)], 1); s.fillRect(xx, yy, 1, 1); }
        cap("e1", "&iquest;Qui&eacute;nes componen la", "clase", "alta en Chile?");
      })();

      // 2. Torre completa: un cubo abierto muestra la escala
      (function () {
        var x = canvasFor("e2");
        tower(x, function (c) { return c.gx === 0 && c.gy === 5 && c.layer === 10 ? GOLD : base(c.s); });
        box(x, 92, 668, 34, 34, 32, GOLD);
        crowd(x, 92, 622, 100, [120, 140, 170]);
        panel("e2", "ESCALA", "1 CUBO", "= 20.000 PERSONAS", "#dcc266"); apex("e2");
        rect("e2", 186, 1036, 210, 4, "#dcc266"); rect("e2", 186, 1036, 4, 44, "#dcc266");
        cap("e2", "Cada cubo representa a", "20.000", "personas.");
      })();

      // 3. Sin hogar, en tres tiempos: torre, zoom al cubo, vuelta
      function sinHogar(id, lit) {
        tower(canvasFor(id), function (c) { return c.s === 0 && lit ? ALERT : dim(c.s); });
      }
      sinHogar("e3a", false);
      apex("e3a");
      cap("e3a", "En la", "base,");

      (function () {
        var bg = document.createElement("canvas"); bg.width = 540; bg.height = 960;
        document.getElementById("e3b").appendChild(bg);
        dots(bg.getContext("2d"));
        var c = document.createElement("canvas"); c.width = 540; c.height = 960;
        c.style.transformOrigin = "540px 1342px";
        c.style.transform = "translateY(-200px) scale(3.5)";
        document.getElementById("e3b").appendChild(c);
        tower(c.getContext("2d"), function (cu) { return cu.s === 0 ? ALERT : dim(cu.s); });
        panel("e3b", "BASE &middot; 1 CUBO", "1 CUBO", "= 20.000 PERSONAS", "#e8527f");
        cap("e3b", "un solo", "cubo:");
      })();

      (function () {
        var x = canvasFor("e3");
        tower(x, function (c) { return c.s === 0 ? ALERT : dim(c.s); });

          var X = xx / R, Y = -yy / R, Z = Math.sqrt(1 - X * X - Y * Y);

          var lon = lon0 + Math.atan2(X, Z * c0 - Y * s0) / D2R;
